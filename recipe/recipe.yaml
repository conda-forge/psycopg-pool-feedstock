schema_version: 1

context:
  name: psycopg-pool
  version: "3.3.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: df87b5d9d0ad7db37f6cdad4fa8ce113d250f5997f6db38e9a99192fb67f9e1d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.3.1
    - wheel >=0.37
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.6

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
        - psycopg >=3.0
    script:
      - pip check
      - python -c "import psycopg_pool"

about:
  summary: Connection Pool for Psycopg
  license: LGPL-3.0-or-later
  license_file: LICENSE.txt
  homepage: https://psycopg.org/psycopg3/
  repository: https://github.com/psycopg/psycopg/
  documentation: https://www.psycopg.org/psycopg3/docs/advanced/pool.html

extra:
  recipe-maintainers:
    - xylar
